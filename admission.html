<!doctype html><html lang="om"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Admission | Bashasha</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><a class="brand" href="index.html">BASHASHA <span>SECONDARY SCHOOL</span></a><nav><a href="index.html">Home</a><a href="results.html">Results</a><a href="login.html">Login</a></nav></header><main class="section narrow"><p class="eyebrow">2026 Admission</p><h1>Online Admission Form</h1><form id="admissionForm" class="form" enctype="multipart/form-data"><div class="grid"><label>First Name<input name="firstName" required></label><label>Middle Name<input name="middleName" required></label><label>Last Name<input name="lastName" required></label><label>Gender<select name="gender" required><option value="">Select</option><option>Male</option><option>Female</option></select></label><label>Date of Birth<input type="date" name="dob" required></label><label>Fayda ID (16 digits)<input name="faydaId" inputmode="numeric" pattern="[0-9]{16}" maxlength="16" required></label><label>Phone<input name="phone" required></label><label>Academic Year<input name="academicYear" value="2026" required></label><label>Grade<select name="grade" id="grade" required><option value="">Select</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><label>Section<input name="section" required></label><label id="studyWrap">Study Option<select name="studyOption" id="studyOption"><option value="">Not required</option><option>Natural Science</option><option>Social Science</option><option>Regular</option></select></label><label>Region<input name="region" required></label><label>Woreda<input name="woreda" required></label><label>Kebele<input name="kebele" required></label><label>Specific Address<input name="address" required></label><label>Student Photo<input type="file" name="studentPhoto" accept="image/*"></label><label>Guardian/Family Photo<input type="file" name="guardianPhoto" accept="image/*"></label></div><h3>Guardian / Family Information</h3><div class="grid"><label>Full Name<input name="guardianName" required></label><label>Phone<input name="guardianPhone" required></label><label>Fayda ID (16 digits)<input name="guardianFaydaId" pattern="[0-9]{16}" maxlength="16" inputmode="numeric" required></label></div><button class="btn" type="submit">Submit Application</button><p id="formMessage" class="message"></p></form></main><script src="js/app.js"></script></body></html>
